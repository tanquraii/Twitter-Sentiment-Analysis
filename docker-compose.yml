version: '3.8'

services:
  backend:
    build: .
    container_name: fast_api_service
    command: uvicorn service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build: .
    container_name: streamlit_interface
    command: streamlit run interface.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000